<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSQLManager - 数据库管理面板</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Element Plus 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.6/dist/index.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/css/app.css?v=20260815-1">
</head>
<body>
    <div id="app">
        <div id="loading" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;color:var(--el-text-color-secondary,#909399);">
            <div style="font-size:48px;margin-bottom:16px;">🗄️</div>
            <div>WebSQLManager 加载中...</div>
        </div>
    </div>
    <div id="load-error" style="display:none;padding:20px;text-align:center;color:var(--el-color-danger,#f56c6c);">
        <h2>前端资源加载失败</h2>
        <p>可能原因：CDN 资源无法访问。请检查网络连接或使用本地资源。</p>
    </div>

    <!-- Vue 3 -->
    <script defer src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
    <!-- Axios -->
    <script defer src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <!-- Element Plus -->
    <script defer src="https://cdn.jsdelivr.net/npm/element-plus@2.7.6/dist/index.full.min.js"></script>
    <!-- Element Plus 中文语言包 -->
    <script defer src="https://cdn.jsdelivr.net/npm/element-plus@2.7.6/dist/locale/zh-cn.min.js"></script>
    <!-- Element Plus 图标 -->
    <script defer src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>

    <!-- 应用脚本 -->
    <script defer src="/js/api.js?v=20260815-1"></script>
    <script defer src="/js/components/connection-manager.js?v=20260815-1"></script>
    <script defer src="/js/components/table-explorer.js?v=20260815-1"></script>
    <script defer src="/js/components/data-browser.js?v=20260815-1"></script>
    <script defer src="/js/components/sql-editor.js?v=20260815-1"></script>
    <script defer src="/js/app.js?v=20260815-1"></script>

    <!-- CDN 资源自检：load 事件在所有 defer 脚本执行完毕后触发 -->
    <script>
        window.addEventListener('load', function () {
            if (typeof Vue === 'undefined' || typeof ElementPlus === 'undefined' || typeof axios === 'undefined') {
                var loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
                document.getElementById('load-error').style.display = 'block';
            }
        });
    </script>
</body>
</html>
